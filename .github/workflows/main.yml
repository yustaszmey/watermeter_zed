
name: Check official Telink TC32

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/telink-semi/telink-dev-tc32:1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate TC32 compiler
        shell: bash
        run: |
          echo "=== Compiler ==="
          command -v tc32-elf-gcc || true
          find / -name tc32-elf-gcc -type f 2>/dev/null | head -20
          echo "=== Version ==="
          tc32-elf-gcc --version || true
