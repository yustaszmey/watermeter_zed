
name: Build Watermeter Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/telink-semi/telink-dev-tc32:1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check compiler
        shell: bash
        run: |
          /opt/toolchain/tc32/bin/tc32-elf-gcc --version

      - name: Build firmware
        shell: bash
        run: |
          export PATH="/opt/toolchain/tc32/bin:$PATH"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          mkdir -p out/platform/services/b85m

          make COMPILE_PREFIX=/opt/toolchain/tc32/bin/tc32

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: watermeter-firmware
          path: |
            **/*.bin
          if-no-files-found: error
