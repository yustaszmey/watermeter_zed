
name: Build Watermeter Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/telink-semi/telink-dev-tc32:1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check compiler
        shell: bash
        run: |
          /opt/toolchain/tc32/bin/tc32-elf-gcc --version



      - name: Build firmware
        shell: bash
        run: |
          set -e
          export PATH="/opt/toolchain/tc32/bin:$PATH"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Установка Python, если он отсутствует
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y python3
            else
              echo "ERROR: apt-get not available"
              exit 1
            fi
          fi

          # Каталоги для файлов SDK
          find tl_zigbee_sdk -type d | while read -r dir; do
            mkdir -p "out/${dir#tl_zigbee_sdk/}"
          done

          # Каталоги для файлов проекта
          find src -type d | while read -r dir; do
            mkdir -p "out/$dir"
          done

          rm -f bin/*.bin bin/*.zigbee

          # Сборка прошивки
          make COMPILE_PREFIX=/opt/toolchain/tc32/bin/tc32



      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: watermeter-firmware
          path: |
            bin/*.bin
            bin/*.zigbee
          if-no-files-found: error
